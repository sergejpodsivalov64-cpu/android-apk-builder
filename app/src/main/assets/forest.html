<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:'Trebuchet MS',sans-serif;background:#76cfa8}.scene{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 72% 17%,#fff4b3 0%,#c8f4c6 24%,#8ed6be 53%,#61b58b 100%)}.sun{position:absolute;right:12%;top:9%;width:10vw;height:10vw;border-radius:50%;background:#fff8c5;box-shadow:0 0 65px 35px #fff8b17c}.hill{position:absolute;bottom:-18%;left:-15%;width:130%;height:68%;background:linear-gradient(#a9d779,#56ae5b);border-radius:50% 50% 0 0}.hill.back{bottom:10%;left:-20%;height:46%;background:#6bbd82}.tree{position:absolute;bottom:24%;font-size:clamp(100px,23vw,280px);filter:drop-shadow(6px 12px 6px #285f4350)}.tree.left{left:-9%}.tree.right{right:-10%}.title{position:absolute;top:3%;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;background:#fff9e8e8;padding:1vh 3vw;border-radius:35px;border:4px solid #e5b87e;box-shadow:0 7px 0 #a5754c70;color:#547344;font-size:clamp(20px,4vw,45px);font-weight:900}.question{position:absolute;top:17%;left:50%;transform:translateX(-50%);font-size:clamp(15px,2.8vw,32px);font-weight:bold;color:#fff;text-shadow:2px 3px 5px #245f40}.animals{position:absolute;bottom:8%;width:100%;display:flex;justify-content:space-evenly;align-items:end}.animal{width:27%;border:0;background:linear-gradient(#fffde8,#ffdfac);border-radius:36px;box-shadow:0 10px 0 #a66d44,0 17px 25px #315b3d75;padding:1vh 0 2vh;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .18s}.animal:active{transform:translateY(7px) scale(.95)}.animal .face{font-size:clamp(80px,15vw,210px);line-height:1.05;filter:drop-shadow(4px 8px 3px #6c593c70)}.animal strong{font-size:clamp(16px,3vw,34px);color:#825130}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:65px;animation:float 1s forwards}@keyframes float{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:translateY(-80px) scale(1.5);opacity:0}}.repeat{position:absolute;left:2%;top:3%;font-size:clamp(24px,4vw,42px);border:0;border-radius:50%;background:#fff9dc;padding:8px}.flower{position:absolute;bottom:3%;font-size:clamp(20px,4vw,45px)}</style></head><body><main class="scene"><div class="sun"></div><div class="hill back"></div><div class="hill"></div><div class="tree left">🌳</div><div class="tree right">🌲</div><div class="title">🌈 ВОЛШЕБНЫЙ ЛЕС 🌈</div><div class="question" id="q">Кто говорит «му-у»?</div><button class="repeat" onclick="ask()">🔊</button><div class="animals"><button class="animal" onclick="answer('bear',event)"><span class="face">🐻</span><strong>МИШКА</strong></button><button class="animal" onclick="answer('cow',event)"><span class="face">🐮</span><strong>КОРОВКА</strong></button><button class="animal" onclick="answer('fox',event)"><span class="face">🦊</span><strong>ЛИСИЧКА</strong></button></div><div class="flower" style="left:4%">🌸🌼</div><div class="flower" style="right:3%">🌻🌷</div><div class="stars" id="stars"></div></main><script>
function say(t){if(window.Android&&Android.speak){Android.speak(t)}}function ask(){document.getElementById('q').textContent='Кто говорит «му-у»?';say('Вика, кто говорит му-у? Найди коровку!')}function answer(a,e){let correct=a==='cow';let s=correct?'Умница, Вика! Это коровка! Му-у!':a==='bear'?'Это мишка! Р-р-р! Найди коровку!':'Это лисичка! Тяв-тяв! Найди коровку!';document.getElementById('q').textContent=correct?'Правильно! Молодец! ⭐':'Попробуй ещё!';say(s);if(correct){let st=document.createElement('div');st.className='star';st.textContent='⭐';st.style.left=e.clientX+'px';st.style.top=e.clientY+'px';document.getElementById('stars').appendChild(st);setTimeout(()=>st.remove(),1000)}}</script></body></html>
